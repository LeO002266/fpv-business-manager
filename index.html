<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>FPV Business Manager</title>
<style>
:root{--bg:#0b1220;--panel:#121d2e;--panel2:#18263a;--line:#26364d;--text:#edf3fb;--muted:#93a4ba;--accent:#70e0b2;--blue:#79aaff;--red:#ff818d;--yellow:#ffd27b;--shadow:0 12px 32px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#102018;font-weight:700}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#49232d;color:#ffdce0}button.small{padding:6px 9px;font-size:12px}input,select,textarea{width:100%;background:#0d1726;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#0e1929;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 24px;font-weight:800;font-size:17px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#0b1720;font-weight:900}.nav{display:grid;gap:5px}.nav button{background:transparent;color:var(--muted);text-align:left;font-weight:600;border-radius:9px;padding:10px 12px}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.nav small{display:block;color:#667b95;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;padding:16px 12px 5px}.sidefoot{position:absolute;bottom:18px;left:20px;right:20px;color:var(--muted);font-size:11px}.main{min-width:0}.topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0c1524}.topbar h1{font-size:19px;margin:0}.topbar .right{display:flex;gap:9px;align-items:center}.content{padding:28px;max-width:1500px;margin:auto}.muted{color:var(--muted)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:25px;font-weight:800;margin:7px 0 2px}.green{color:var(--accent)}.red{color:var(--red)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:16px;margin:0}.two{grid-template-columns:1.3fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}td{font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#203a37;color:var(--accent);font-size:11px}.pill.pending{background:#40351f;color:var(--yellow)}.pill.expense{background:#41252e;color:var(--red)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid .wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:250px}.empty{text-align:center;padding:35px;color:var(--muted)}.barlist{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:105px 1fr 90px;align-items:center;gap:10px;font-size:12px}.track{height:9px;background:#26364d;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:20px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0;font-size:18px}.close{background:transparent;color:var(--muted);font-size:22px;padding:0 7px}.notice{background:#1c3041;border:1px solid #31516a;padding:12px 14px;border-radius:10px;color:#c4d9ee;margin:12px 0;font-size:12px}.chart{height:180px;display:flex;align-items:end;gap:10px;padding:15px 4px 25px;border-bottom:1px solid var(--line)}.chartcol{flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;height:100%;gap:7px}.chartbar{width:min(32px,75%);background:linear-gradient(180deg,var(--accent),#3a8f81);border-radius:7px 7px 2px 2px;min-height:3px}.chartcol span{font-size:10px;color:var(--muted)}.mobilemenu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:4;left:-260px;width:245px;transition:.2s}.sidebar.open{left:0}.mobilemenu{display:inline-block}.topbar{padding:0 16px}.content{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidefoot{position:static;margin:25px 10px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:9px}.stat-value{font-size:20px}.card{padding:13px}.content{padding:13px}.topbar h1{font-size:16px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.barrow{grid-template-columns:80px 1fr 65px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">FPV</div><div>FPV Business<br><span class="muted" style="font-size:11px;font-weight:500">MANAGER</span></div></div>
<nav class="nav" id="nav">
<small>Workspace</small>
<button data-page="dashboard" class="active">▦ &nbsp; Dashboard</button>
<button data-page="transactions">⇄ &nbsp; Income & Expenses</button>
<button data-page="clients">♙ &nbsp; Clients</button>
<button data-page="projects">▣ &nbsp; Projects & Bookings</button>
<button data-page="reminders">◷ &nbsp; Reminders</button>
<button data-page="invoices">▤ &nbsp; Invoices & Quotations</button>
<button data-page="equipment">◈ &nbsp; Drone & Equipment</button>
<small>Insights & Admin</small>
<button data-page="reports">▥ &nbsp; Reports</button>
<button data-page="team">♧ &nbsp; Team & Users</button>
<button data-page="settings">⚙ &nbsp; Settings & Backup</button>
</nav><div class="sidefoot">Local-first starter build · v1.0<br>Data stays in this browser</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="secondary mobilemenu" id="menuBtn">☰</button><h1 id="pageTitle">Dashboard</h1></div><div class="right"><span class="muted" id="today"></span><button id="quickAdd">+ Add Entry</button></div></header><div class="content" id="view"></div></main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Add</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:db.settings.currency||'INR',maximumFractionDigits:0}).format(Number(n)||0), today=()=>new Date().toISOString().slice(0,10), uid=()=>Math.random().toString(36).slice(2,10);
const blank={clients:[],transactions:[],projects:[],reminders:[],invoices:[],equipment:[],team:[],settings:{business:'FPV Business Manager',currency:'INR',owner:'Owner',phone:'',email:''}};
let db=JSON.parse(localStorage.getItem('fpvManagerDB')||'null')||blank;
function save(){localStorage.setItem('fpvManagerDB',JSON.stringify(db));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sum(arr,fn){return arr.reduce((a,x)=>a+(Number(fn(x))||0),0)}
function page(p){$('#nav').querySelectorAll('button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#pageTitle').textContent=({dashboard:'Dashboard',transactions:'Income & Expenses',clients:'Clients',projects:'Projects & Bookings',reminders:'Reminders',invoices:'Invoices & Quotations',equipment:'Drone & Equipment',reports:'Reports',team:'Team & Users',settings:'Settings & Backup'})[p];$('#sidebar').classList.remove('open');render(p)}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)page(b.dataset.page)});
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
function modal(title,html,submit){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show');$('#modalBody').querySelector('form').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));submit(data);$('#modal').classList.remove('show');save();render(current)}}
let current='dashboard';
function openForm(title,fields,submit){modal(title,`<form><div class="form-grid">${fields.map(f=>`<div class="${f.wide?'wide':''}"><label>${f.label}</label>${f.type==='select'?`<select name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea name="${f.name}" rows="3" placeholder="${f.placeholder||''}"></textarea>`:`<input name="${f.name}" type="${f.type||'text'}" value="${f.value||''}" placeholder="${f.placeholder||''}" ${f.required?'required':''}>`}</div>`).join('')}</div><div class="actions" style="margin-top:18px"><button>Save</button><button type="button" class="secondary" onclick="document.querySelector('#modal').classList.remove('show')">Cancel</button></div></form>`,submit)}
function header(title,action=''){return `<div class="section-head"><h2>${title}</h2><div class="toolbar">${action}</div></div>`}
function stat(label,value,note='',color=''){return `<div class="card"><div class="stat-label">${label}</div><div class="stat-value ${color}">${value}</div><div class="muted" style="font-size:11px">${note}</div></div>`}
function table(head,rows){return `<div class="card table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}" class="empty">No records yet</td></tr>`}</tbody></table></div>`}
function btn(label,action,cls=''){return `<button class="small ${cls}" onclick="${action}">${label}</button>`}
function addTransaction(){openForm('Add transaction',[{name:'type',label:'Type',type:'select',options:['Income','Expense']},{name:'date',label:'Date',type:'date',value:today()},{name:'amount',label:'Amount',type:'number',required:true},{name:'category',label:'Category',placeholder:'Shoot payment, travel, battery...'},{name:'client',label:'Client / Vendor'},{name:'method',label:'Payment method',type:'select',options:['Cash','UPI','Bank Transfer','Card','Other']},{name:'note',label:'Notes',type:'textarea',wide:true}],d=>db.transactions.unshift({id:uid(),...d}))}
function addClient(){openForm('Add client',[{name:'name',label:'Client name',required:true},{name:'phone',label:'Phone'},{name:'email',label:'Email',type:'email'},{name:'company',label:'Company'},{name:'note',label:'Notes',type:'textarea',wide:true}],d=>db.clients.unshift({id:uid(),...d}))}
function addProject(){openForm('New project / booking',[{name:'name',label:'Project name',required:true},{name:'client',label:'Client'},{name:'type',label:'Shoot type',type:'select',options:['Wedding','Event','Advertisement','Real Estate','Travel','Other']},{name:'date',label:'Shoot date',type:'date',value:today()},{name:'amount',label:'Total amount',type:'number'},{name:'advance',label:'Advance received',type:'number'},{name:'status',label:'Status',type:'select',options:['Booked','In Progress','Completed','Cancelled']},{name:'note',label:'Notes',type:'textarea',wide:true}],d=>db.projects.unshift({id:uid(),...d}))}
function addReminder(){openForm('Schedule reminder',[{name:'title',label:'Reminder title',required:true},{name:'client',label:'Client'},{name:'due',label:'Due date',type:'date',value:today()},{name:'channel',label:'Channel',type:'select',options:['WhatsApp','Call','Email','SMS','Personal']},{name:'status',label:'Status',type:'select',options:['Pending','Done']},{name:'message',label:'Message',type:'textarea',wide:true}],d=>db.reminders.unshift({id:uid(),...d}))}
function addInvoice(){openForm('Create invoice / quotation',[{name:'number',label:'Invoice number',value:'FPV-'+Date.now().toString().slice(-6),required:true},{name:'client',label:'Client',required:true},{name:'date',label:'Issue date',type:'date',value:today()},{name:'due',label:'Due date',type:'date'},{name:'description',label:'Description',wide:true},{name:'amount',label:'Amount',type:'number',required:true},{name:'tax',label:'Tax %',type:'number',value:'0'},{name:'status',label:'Status',type:'select',options:['Unpaid','Partially Paid','Paid']}],d=>db.invoices.unshift({id:uid(),...d}))}
function addEquipment(){openForm('Add drone / equipment',[{name:'name',label:'Equipment name',required:true},{name:'category',label:'Category',type:'select',options:['FPV Drone','Camera','Battery','Controller','Goggles','Charger','Other']},{name:'serial',label:'Serial number'},{name:'cost',label:'Purchase cost',type:'number'},{name:'condition',label:'Condition',type:'select',options:['New','Good','Needs Repair','Retired']},{name:'maintenance',label:'Next maintenance date',type:'date'}],d=>db.equipment.unshift({id:uid(),...d}))}
function removeItem(key,id){if(confirm('Delete this record?')){db[key]=db[key].filter(x=>x.id!==id);save();render(current)}}
function toggleReminder(id){let x=db.reminders.find(z=>z.id===id);if(x)x.status=x.status==='Done'?'Pending':'Done';save();render(current)}
function download(name,content,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function backup(){download('fpv-business-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.transactions||!d.clients)throw Error();db=d;save();render('settings');alert('Backup restored')}catch{alert('Invalid backup file')}};r.readAsText(f)}
function clearData(){if(confirm('This will permanently delete all app data in this browser. Continue?')&&confirm('Are you absolutely sure?')){db=JSON.parse(JSON.stringify(blank));save();render('settings')}}
function exportCSV(){let cols=['date','type','amount','category','client','method','note'];let csv=[cols.join(','),...db.transactions.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');download('fpv-transactions.csv',csv,'text/csv')}
function printInvoice(id){let x=db.invoices.find(z=>z.id===id);if(!x)return;let w=window.open('','_blank');w.document.write(`<html><head><title>${esc(x.number)}</title><style>body{font:15px Arial;padding:45px;color:#222}.head{display:flex;justify-content:space-between}table{width:100%;margin-top:40px;border-collapse:collapse}td,th{padding:14px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><div class="head"><div><h1>${esc(db.settings.business)}</h1><p>${esc(db.settings.phone)} · ${esc(db.settings.email)}</p></div><h2>INVOICE</h2></div><hr><p><b>Invoice:</b> ${esc(x.number)}<br><b>Client:</b> ${esc(x.client)}<br><b>Date:</b> ${esc(x.date)}<br><b>Due:</b> ${esc(x.due||'—')}</p><table><tr><th>Description</th><th>Amount</th></tr><tr><td>${esc(x.description||'FPV Drone Services')}</td><td>${money(x.amount)}</td></tr><tr><td>Tax (${x.tax||0}%)</td><td>${money(x.amount*(x.tax||0)/100)}</td></tr><tr><th>Total</th><th>${money(x.amount*(1+(x.tax||0)/100))}</th></tr></table><p style="margin-top:60px">Thank you for your business.</p><script>window.print()<\/script></body></html>`);w.document.close()}
function render(p){current=p;let v=$('#view');if(p==='dashboard'){let inc=sum(db.transactions.filter(x=>x.type==='Income'),x=>x.amount),exp=sum(db.transactions.filter(x=>x.type==='Expense'),x=>x.amount),pending=sum(db.projects,x=>Math.max(0,(+x.amount||0)-(+x.advance||0)));let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-5+i);let key=d.toISOString().slice(0,7);return {key,label:d.toLocaleDateString('en-IN',{month:'short'}),income:sum(db.transactions.filter(x=>x.type==='Income'&&(x.date||'').startsWith(key)),x=>x.amount)}}),max=Math.max(1,...months.map(x=>x.income));let recent=db.transactions.slice(0,6).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.client||'—')}</td><td><span class="pill ${x.type==='Expense'?'expense':''}">${x.type}</span></td><td>${money(x.amount)}</td></tr>`).join('');v.innerHTML=`<div class="muted">Business overview · ${esc(db.settings.business)}</div><div class="grid stats">${stat('Total income',money(inc),'All recorded income','green')}${stat('Total expenses',money(exp),'All recorded expenses','red')}${stat('Net profit',money(inc-exp),'Income minus expenses',inc>=exp?'green':'red')}${stat('Pending project balance',money(pending),'Project amount less advance','yellow')}</div><div class="grid two"><div class="card"><div class="section-head"><h2>Income · Last 6 months</h2></div><div class="chart">${months.map(x=>`<div class="chartcol"><div class="chartbar" style="height:${Math.max(3,x.income/max*100)}%"></div><span>${x.label}</span></div>`).join('')}</div></div><div class="card"><h2>Quick actions</h2><div class="actions" style="margin-top:18px"><button onclick="addTransaction()">+ Add transaction</button><button class="secondary" onclick="addProject()">New booking</button><button class="secondary" onclick="addClient()">Add client</button><button class="secondary" onclick="addInvoice()">Create invoice</button></div><div class="notice">Your records are stored locally in this browser. Use Settings & Backup to export a copy.</div></div></div>${header('Recent transactions',`<button class="secondary" onclick="page('transactions')">View all</button>`)}${table(['Date','Category','Client / Vendor','Type','Amount'],recent)}`}
if(p==='transactions'){let rows=db.transactions.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.client||'—')}</td><td>${esc(x.method||'—')}</td><td><span class="pill ${x.type==='Expense'?'expense':''}">${x.type}</span></td><td>${money(x.amount)}</td><td>${btn('Delete',`removeItem('transactions','${x.id}')`,'danger')}</td></tr>`).join('');v.innerHTML=header('All transactions',`<button onclick="addTransaction()">+ Add transaction</button>`)+`<div class="grid stats">${stat('Income',money(sum(db.transactions.filter(x=>x.type==='Income'),x=>x.amount)),'Total','green')}${stat('Expenses',money(sum(db.transactions.filter(x=>x.type==='Expense'),x=>x.amount)),'Total','red')}${stat('Transactions',db.transactions.length,'All entries')}${stat('Net',money(sum(db.transactions.filter(x=>x.type==='Income'),x=>x.amount)-sum(db.transactions.filter(x=>x.type==='Expense'),x=>x.amount)),'Income - expenses')}</div>`+table(['Date','Category','Client / Vendor','Method','Type','Amount',''],rows)}
if(p==='clients'){let rows=db.clients.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.company||'—')}</td><td>${db.projects.filter(z=>z.client===x.name).length}</td><td>${btn('Delete',`removeItem('clients','${x.id}')`,'danger')}</td></tr>`).join('');v.innerHTML=header('Client directory',`<button onclick="addClient()">+ Add client</button>`)+`<div class="notice">Save client details here, then use the same client name in projects, transactions and reminders.</div>`+table(['Client','Phone','Email','Company','Projects',''],rows)}
if(p==='projects'){let rows=db.projects.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.client||'—')}</td><td>${esc(x.type||'—')}</td><td>${esc(x.date||'—')}</td><td>${money(x.amount)}</td><td>${money(x.advance)}</td><td><span class="pill ${x.status==='Completed'?'':'pending'}">${esc(x.status)}</span></td><td>${btn('Delete',`removeItem('projects','${x.id}')`,'danger')}</td></tr>`).join('');v.innerHTML=header('Projects & bookings',`<button onclick="addProject()">+ New project</button>`)+table(['Project','Client','Type','Shoot date','Amount','Advance','Status',''],rows)}
if(p==='reminders'){let rows=db.reminders.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted">${esc(x.message||'')}</div></td><td>${esc(x.client||'—')}</td><td>${esc(x.due||'—')}</td><td>${esc(x.channel)}</td><td><span class="pill ${x.status==='Done'?'':'pending'}">${esc(x.status)}</span></td><td>${btn(x.status==='Done'?'Reopen':'Mark done',`toggleReminder('${x.id}')`)} ${btn('Delete',`removeItem('reminders','${x.id}')`,'danger')}</td></tr>`).join('');v.innerHTML=header('Reminders & follow-ups',`<button onclick="addReminder()">+ Schedule reminder</button>`)+`<div class="notice">This starter version stores reminders and due dates in the app. Sending WhatsApp/SMS/email automatically requires connecting an approved messaging provider and backend scheduler.</div>`+table(['Reminder','Client','Due date','Channel','Status',''],rows)}
if(p==='invoices'){let rows=db.invoices.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.client)}</td><td>${esc(x.date)}</td><td>${esc(x.due||'—')}</td><td>${money(x.amount*(1+(x.tax||0)/100))}</td><td><span class="pill ${x.status==='Paid'?'':'pending'}">${esc(x.status)}</span></td><td>${btn('Print / PDF',`printInvoice('${x.id}')`)} ${btn('Delete',`removeItem('invoices','${x.id}')`,'danger')}</td></tr>`).join('');v.innerHTML=header('Invoices & quotations',`<button onclick="addInvoice()">+ Create invoice</button>`)+table(['Number','Client','Issue date','Due date','Total incl. tax','Status',''],rows)}
if(p==='equipment'){let rows=db.equipment.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.serial||'—')}</td><td>${money(x.cost)}</td><td>${esc(x.condition)}</td><td>${esc(x.maintenance||'—')}</td><td>${btn('Delete',`removeItem('equipment','${x.id}')`,'danger')}</td></tr>`).join('');v.innerHTML=header('Drone & equipment inventory',`<button onclick="addEquipment()">+ Add equipment</button>`)+table(['Equipment','Category','Serial no.','Cost','Condition','Next maintenance',''],rows)}
if(p==='reports'){let inc=sum(db.transactions.filter(x=>x.type==='Income'),x=>x.amount),exp=sum(db.transactions.filter(x=>x.type==='Expense'),x=>x.amount),byClient={};db.transactions.filter(x=>x.type==='Income').forEach(x=>byClient[x.client||'Unassigned']=(byClient[x.client||'Unassigned']||0)+(+x.amount||0));let rows=Object.entries(byClient).sort((a,b)=>b[1]-a[1]).map(([n,a])=>`<tr><td>${esc(n)}</td><td>${money(a)}</td></tr>`).join('');v.innerHTML=header('Business reports',`<button onclick="exportCSV()">Export transactions CSV</button>`)+`<div class="grid stats">${stat('Gross income',money(inc),'All-time','green')}${stat('Total expenses',money(exp),'All-time','red')}${stat('Net profit',money(inc-exp),'All-time',inc>=exp?'green':'red')}${stat('Invoice value',money(sum(db.invoices,x=>x.amount)),'Before tax')}</div>${header('Client-wise income')}${table(['Client','Income'],rows)}<div class="notice">For accounting/tax filing, verify entries with your accountant. Tax summaries here are simple totals, not statutory filings.</div>`}
if(p==='team'){let rows=db.team.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.role)}</td><td>${esc(x.email||'—')}</td><td>${btn('Delete',`removeItem('team','${x.id}')`,'danger')}</td></tr>`).join('');v.innerHTML=header('Team & user directory',`<button onclick="openForm('Add team member',[{name:'name',label:'Name',required:true},{name:'role',label:'Role',type:'select',options:['Owner','Pilot','Editor','Accountant','Viewer']},{name:'email',label:'Email',type:'email'}],d=>db.team.unshift({id:uid(),...d}))">+ Add member</button>`)+`<div class="notice">Team records are informational in this offline starter. Real multi-user login, role permissions and shared cloud access require backend authentication.</div>`+table(['Name','Role','Email',''],rows)}
if(p==='settings'){v.innerHTML=header('Business settings')+`<div class="card"><form id="settingsForm"><div class="form-grid"><div><label>Business name</label><input name="business" value="${esc(db.settings.business)}"></div><div><label>Owner name</label><input name="owner" value="${esc(db.settings.owner)}"></div><div><label>Phone</label><input name="phone" value="${esc(db.settings.phone)}"></div><div><label>Email</label><input name="email" value="${esc(db.settings.email)}"></div><div><label>Currency</label><select name="currency"><option value="INR" ${db.settings.currency==='INR'?'selected':''}>INR (₹)</option><option value="USD" ${db.settings.currency==='USD'?'selected':''}>USD ($)</option><option value="EUR" ${db.settings.currency==='EUR'?'selected':''}>EUR (€)</option></select></div></div><div class="actions" style="margin-top:16px"><button>Save settings</button></div></form></div><div class="section-head"><h2>Data backup</h2></div><div class="card"><p class="muted">Export a JSON backup to keep a copy of all records. Import a previous backup to restore your data.</p><div class="actions"><button onclick="backup()">Download backup</button><label class="secondary" style="padding:10px 14px;border-radius:9px;cursor:pointer">Restore backup<input type="file" accept="application/json" style="display:none" onchange="restore(event)"></label><button class="danger" onclick="clearData()">Delete all app data</button></div></div><div class="notice">Privacy note: data is stored in this browser on this device. It is not synced to a server or automatically backed up.</div>`;$('#settingsForm').onsubmit=e=>{e.preventDefault();db.settings=Object.fromEntries(new FormData(e.target));save();alert('Settings saved');render('settings')}}
}
function download(name,content,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportCSV(){let cols=['date','type','amount','category','client','method','note'];let csv=[cols.join(','),...db.transactions.map(x=>cols.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');download('fpv-transactions.csv',csv,'text/csv')}
function printInvoice(id){let x=db.invoices.find(z=>z.id===id);if(!x)return;let w=window.open('','_blank');w.document.write(`<html><head><title>${esc(x.number)}</title></head><body><h1>${esc(db.settings.business)}</h1><h2>INVOICE</h2><p>Invoice: ${esc(x.number)}<br>Client: ${esc(x.client)}<br>Date: ${esc(x.date)}<br>Due: ${esc(x.due||'—')}</p><p>${esc(x.description||'FPV Drone Services')} — ${money(x.amount)}</p><p>Tax: ${money(x.amount*(x.tax||0)/100)}</p><h3>Total: ${money(x.amount*(1+(x.tax||0)/100))}</h3><script>window.print()<\/script></body></html>`);w.document.close()}
$('#quickAdd').onclick=addTransaction;render('dashboard');
</script></body></html>
