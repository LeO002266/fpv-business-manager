<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>FPV Business Manager</title>
<style>
:root{--bg:#0b1220;--panel:#121d2e;--panel2:#1a2940;--line:#2b3b52;--txt:#eef4fc;--muted:#9aabc0;--green:#67dfb0;--blue:#80adff;--red:#ff8490;--amber:#ffd17b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 Inter,system-ui,Arial}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;background:var(--green);color:#092018;font-weight:700;cursor:pointer}button.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}button.danger{background:#512832;color:#ffdce0}button.sm{padding:6px 9px;font-size:12px}input,select,textarea{width:100%;padding:10px;background:#0c1727;color:var(--txt);border:1px solid var(--line);border-radius:9px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#0e1929;border-right:1px solid var(--line);padding:18px 12px}.brand{font-size:18px;font-weight:800;padding:8px 10px 22px}.brand b{color:var(--green)}nav{display:grid;gap:4px}nav button{text-align:left;background:transparent;color:var(--muted);font-weight:600}nav button.active,nav button:hover{background:var(--panel2);color:var(--txt)}.hint{font-size:11px;color:var(--muted);margin:22px 10px}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 26px;background:#0c1524}.top h1{font-size:18px}.content{padding:25px;max-width:1500px;margin:auto}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}.muted,.statlabel{color:var(--muted)}.statlabel{font-size:12px}.stat{font-size:24px;font-weight:800;margin:7px 0}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.head h2{font-size:16px;margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:230px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase}td{font-size:13px}.pill{background:#1d4038;color:var(--green);padding:4px 8px;border-radius:20px;font-size:11px}.pill.pending{background:#44391f;color:var(--amber)}.pill.exp{background:#472832;color:var(--red)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wide{grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{font-size:18px;margin:0}.close{background:none;color:var(--muted);font-size:22px;padding:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.notice{padding:11px 13px;background:#1a3042;border:1px solid #2c5068;border-radius:10px;color:#c8def0;font-size:12px;margin:12px 0}.empty{text-align:center;padding:30px;color:var(--muted)}.bar{height:9px;background:#26364d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.clientgrid{grid-template-columns:repeat(3,1fr)}.mobile{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:8;left:-250px;width:235px;transition:.2s}.side.open{left:0}.mobile{display:inline-block}.content{padding:16px}.top{padding:0 14px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.clientgrid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.stats{gap:8px}.stat{font-size:19px}.card{padding:12px}.content{padding:12px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.clientgrid{grid-template-columns:1fr}.top h1{font-size:16px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><b>FPV</b> Business Manager</div><nav id="nav">
<button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="clients">♙ Clients</button><button data-page="projects">▣ Projects & Bookings</button><button data-page="expenses">⇄ Expenses & Travel</button><button data-page="invoices">▤ Invoices & Payments</button><button data-page="equipment">◈ Drone & Equipment</button><button data-page="reports">▥ Reports & Profit</button><button data-page="team">♧ Team</button><button data-page="settings">⚙ Settings & Backup</button></nav><div class="hint">Prototype v2 · Data saved in this browser</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="secondary mobile" id="menu">☰</button><h1 id="title">Dashboard</h1></div><div class="toolbar"><span class="muted" id="date"></span><button onclick="quickAdd()">+ Add New</button></div></header><div class="content" id="view"></div></main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt">Add record</h2><button class="close" onclick="closeModal()">×</button></div><div id="mb"></div></div></div>
<script>
const $=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10),n=v=>Number(v)||0,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=(v,c='INR')=>new Intl.NumberFormat('en-IN',{style:'currency',currency:c||'INR',maximumFractionDigits:2}).format(n(v)),sum=(a,f)=>a.reduce((t,x)=>t+n(f(x)),0);
const blank={clients:[],projects:[],expenses:[],invoices:[],payments:[],equipment:[],team:[],settings:{business:'FPV Business Manager',owner:'Owner',baseCurrency:'INR',fuelPrice:105,defaultMileage:25,phone:'',email:'',address:''}};
let db=JSON.parse(localStorage.getItem('fpvManagerV2')||'null')||blank,cur='dashboard';
function save(){localStorage.setItem('fpvManagerV2',JSON.stringify(db))}
function clientName(cid){return db.clients.find(x=>x.id===cid)?.name||'—'}function projectName(pid){return db.projects.find(x=>x.id===pid)?.name||'—'}
function inBase(amount,currency,rate){return n(amount)*(currency===db.settings.baseCurrency?1:n(rate)||1)}
function openModal(title,fields,submit){$('#mt').textContent=title;$('#mb').innerHTML='<form id="form"><div class="formgrid">'+fields.map(f=>'<div class="'+(f.wide?'wide':'')+'"><label>'+f.label+'</label>'+(f.type==='select'?'<select name="'+f.name+'" '+(f.required?'required':'')+'>'+f.options.map(o=>'<option value="'+esc(o.value??o)+'" '+(o.selected?'selected':'')+'>'+esc(o.label??o)+'</option>').join('')+'</select>':f.type==='textarea'?'<textarea name="'+f.name+'" rows="3" placeholder="'+(f.placeholder||'')+'"></textarea>':'<input name="'+f.name+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+(f.placeholder||'')+'" '+(f.required?'required':'')+' '+(f.step?'step="'+f.step+'"':'')+'>')+'</div>').join('')+'</div><div class="actions"><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>';$('#modal').classList.add('show');$('#form').onsubmit=e=>{e.preventDefault();submit(Object.fromEntries(new FormData(e.target)));save();closeModal();render(cur)}}
function closeModal(){$('#modal').classList.remove('show')}
function opts(items,placeholder){return [{value:'',label:placeholder||'Select...'},...items.map(x=>({value:x.id,label:x.name||x.title}))]}
function head(title,action){return '<div class="head"><h2>'+title+'</h2><div class="toolbar">'+(action||'')+'</div></div>'}
function stat(label,value,note,color){return '<div class="card"><div class="statlabel">'+label+'</div><div class="stat '+(color||'')+'">'+value+'</div><div class="muted" style="font-size:11px">'+(note||'')+'</div></div>'}
function table(headers,rows){return '<div class="card tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows||'<tr><td class="empty" colspan="'+headers.length+'">No records yet</td></tr>')+'</tbody></table></div>'}
function btn(text,fn,cls='secondary'){return '<button class="sm '+cls+'" onclick="'+fn+'">'+text+'</button>'}
function nav(p){cur=p;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#title').textContent=({dashboard:'Dashboard',clients:'Client CRM',projects:'Projects & Bookings',expenses:'Expenses & Travel',invoices:'Invoices & Payments',equipment:'Drone & Equipment',reports:'Reports & Profit',team:'Team',settings:'Settings & Backup'})[p];$('#side').classList.remove('open');render(p)}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)nav(b.dataset.page)};$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#date').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
function addClient(){openModal('Add client',[{name:'name',label:'Client / Company name',required:true},{name:'phone',label:'Phone / WhatsApp'},{name:'email',label:'Email',type:'email'},{name:'country',label:'Country',value:'India'},{name:'address',label:'Address / City'},{name:'notes',label:'Notes',type:'textarea',wide:true}],d=>db.clients.unshift({id:id(),...d,created:today()}))}
function addProject(){openModal('Create project / shoot booking',[{name:'name',label:'Project name',required:true},{name:'clientId',label:'Client',type:'select',options:opts(db.clients,'Choose client'),required:true},{name:'type',label:'Shoot type',type:'select',options:['Wedding','Event','Advertisement','Real Estate','Travel Film','Music Video','Other']},{name:'location',label:'Shoot location'},{name:'date',label:'Shoot date',type:'date',value:today()},{name:'serviceFee',label:'Agreed service fee',type:'number',value:'0',step:'0.01'},{name:'status',label:'Status',type:'select',options:['Enquiry','Quoted','Booked','In Progress','Completed','Cancelled']},{name:'notes',label:'Notes',type:'textarea',wide:true}],d=>db.projects.unshift({id:id(),...d}))}
function addExpense(){openModal('Add expense / travel record',[{name:'date',label:'Expense date',type:'date',value:today()},{name:'clientId',label:'Client (optional)',type:'select',options:opts(db.clients,'Business / no client')},{name:'projectId',label:'Project (optional)',type:'select',options:opts(db.projects,'Select project')},{name:'spentBy',label:'Who travelled / paid',placeholder:'Owner / Pilot / Team member'},{name:'from',label:'From location',value:'Rajnagar Village'},{name:'to',label:'To location'},{name:'mode',label:'Travel mode',type:'select',options:['Bike','Car','Bus','Train','Flight','Taxi','Other']},{name:'category',label:'Expense category',type:'select',options:['Petrol','Diesel','Toll','Parking','Hotel','Food','Flight / Train Ticket','Local Transport','Equipment Rental','Other']},{name:'amount',label:'Actual amount',type:'number',required:true,step:'0.01'},{name:'currency',label:'Currency',type:'select',options:['INR','USD','AED','EUR','GBP','CAD','AUD','SGD','JPY']},{name:'rate',label:'Exchange rate to base currency',type:'number',value:'1',step:'0.0001'},{name:'billable',label:'Billing treatment',type:'select',options:[{value:'yes',label:'Client Billable – can add to invoice'},{value:'no',label:'Business Expense – internal only'}]},{name:'receipt',label:'Receipt / bill reference (URL or filename)'},{name:'notes',label:'Notes',type:'textarea',wide:true}],d=>db.expenses.unshift({id:id(),...d,invoiceId:'',created:today()}))}
function addInvoice(){openModal('Create client invoice',[{name:'clientId',label:'Client',type:'select',options:opts(db.clients,'Choose client'),required:true},{name:'projectId',label:'Project',type:'select',options:opts(db.projects,'Choose project (optional)')},{name:'number',label:'Invoice number',value:'FPV-'+Date.now().toString().slice(-6),required:true},{name:'date',label:'Issue date',type:'date',value:today()},{name:'due',label:'Due date',type:'date'},{name:'service',label:'Service / shoot charges',type:'number',value:'0',step:'0.01'},{name:'currency',label:'Invoice currency',type:'select',options:['INR','USD','AED','EUR','GBP','CAD','AUD','SGD','JPY']},{name:'exchangeRate',label:'Invoice currency rate (base currency per 1 unit; use 1 for base currency)',type:'number',value:'1',step:'0.0001'},{name:'tax',label:'Tax %',type:'number',value:'0',step:'0.01'},{name:'discount',label:'Discount',type:'number',value:'0',step:'0.01'},{name:'includeTravel',label:'Travel expenses',type:'select',options:[{value:'yes',label:'Automatically include unbilled client-billable expenses'},{value:'no',label:'Do not include travel expenses'}]},{name:'notes',label:'Notes / payment terms',type:'textarea',wide:true}],d=>{let linked=db.expenses.filter(x=>d.includeTravel==='yes'&&x.billable==='yes'&&!x.invoiceId&&x.clientId===d.clientId&&(!d.projectId||x.projectId===d.projectId));let c=d.currency||'INR';let lines=[{description:'FPV drone service / shoot',amount:n(d.service),currency:c}];linked.forEach(x=>lines.push({description:x.category+' – '+(x.from||'')+' to '+(x.to||''),amount:convert(x.amount,x.currency,x.rate,c,d.exchangeRate),currency:c,expenseId:x.id}));let sub=sum(lines,x=>x.amount),tax=sub*n(d.tax)/100,total=Math.max(0,sub+tax-n(d.discount));let inv={id:id(),...d,lines,subtotal:sub,taxAmount:tax,total,paid:0,status:'Unpaid',created:today()};db.invoices.unshift(inv);linked.forEach(x=>x.invoiceId=inv.id)})}
function convert(amount,from,fromRate,to,toRate){if(from===to)return n(amount);let base=n(amount)*(from===db.settings.baseCurrency?1:n(fromRate)||1);return to===db.settings.baseCurrency?base:base/(n(toRate)||1)}
function addPayment(invId){let x=db.invoices.find(z=>z.id===invId);if(!x)return;openModal('Record client payment',[{name:'date',label:'Payment date',type:'date',value:today()},{name:'amount',label:'Amount received ('+x.currency+')',type:'number',value:String(Math.max(0,x.total-x.paid)),required:true,step:'0.01'},{name:'method',label:'Payment method',type:'select',options:['Cash','UPI','Bank Transfer','Card','PayPal','Wise','Other']},{name:'reference',label:'Transaction reference'},{name:'notes',label:'Notes',type:'textarea',wide:true}],d=>{db.payments.unshift({id:id(),invoiceId:invId,clientId:x.clientId,projectId:x.projectId,...d,currency:x.currency});x.paid=Math.min(x.total,n(x.paid)+n(d.amount));x.status=x.paid>=x.total?'Paid':x.paid>0?'Partially Paid':'Unpaid'})}
function addEquipment(){openModal('Add equipment',[{name:'name',label:'Equipment name',required:true},{name:'type',label:'Category',type:'select',options:['FPV Drone','Camera','Battery','Controller','Goggles','Charger','Vehicle','Other']},{name:'serial',label:'Serial / asset ID'},{name:'purchase',label:'Purchase date',type:'date'},{name:'cost',label:'Purchase cost',type:'number'},{name:'condition',label:'Condition',type:'select',options:['New','Good','Needs Repair','Retired']},{name:'maintenance',label:'Next maintenance date',type:'date'}],d=>db.equipment.unshift({id:id(),...d}))}
function addTeam(){openModal('Add team member',[{name:'name',label:'Name',required:true},{name:'role',label:'Role',type:'select',options:['Pilot','Camera Operator','Editor','Spotter','Accounts','Admin','Other']},{name:'phone',label:'Phone'},{name:'rate',label:'Daily / project rate',type:'number'},{name:'notes',label:'Notes',type:'textarea',wide:true}],d=>db.team.unshift({id:id(),...d}))}
function remove(key,xid){if(confirm('Delete this record?')){db[key]=db[key].filter(x=>x.id!==xid);save();render(cur)}}
function printInvoice(xid){let x=db.invoices.find(z=>z.id===xid);if(!x)return;let rows=x.lines.map(l=>'<tr><td>'+esc(l.description)+'</td><td>'+fmt(l.amount,x.currency)+'</td></tr>').join('');let w=window.open('','_blank');w.document.write('<html><head><title>Invoice '+esc(x.number)+'</title><style>body{font:14px Arial;padding:40px;color:#222}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}</style></head><body><h1>'+esc(db.settings.business)+'</h1><p>'+esc(db.settings.address)+'<br>'+esc(db.settings.phone)+' · '+esc(db.settings.email)+'</p><hr><h2>INVOICE</h2><p><b>Invoice:</b> '+esc(x.number)+'<br><b>Bill to:</b> '+esc(clientName(x.clientId))+'<br><b>Project:</b> '+esc(projectName(x.projectId))+'<br><b>Date:</b> '+esc(x.date)+' · <b>Due:</b> '+esc(x.due||'—')+'</p><table><tr><th>Description</th><th class="r">Amount</th></tr>'+rows+'<tr><td>Subtotal</td><td class="r">'+fmt(x.subtotal,x.currency)+'</td></tr><tr><td>Tax</td><td class="r">'+fmt(x.taxAmount,x.currency)+'</td></tr><tr><td>Discount</td><td class="r">-'+fmt(x.discount,x.currency)+'</td></tr><tr><th>Total</th><th class="r">'+fmt(x.total,x.currency)+'</th></tr><tr><td>Received</td><td class="r">'+fmt(x.paid,x.currency)+'</td></tr><tr><th>Balance due</th><th class="r">'+fmt(x.total-x.paid,x.currency)+'</th></tr></table><p>'+esc(x.notes||'Thank you for your business.')+'</p><script>window.print()<\\/script></body></html>');w.document.close()}
function exportJSON(){download('fpv-business-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}function download(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.clients||!d.invoices)throw 0;db=d;save();render('settings');alert('Backup restored')}catch{alert('Invalid backup file')}};r.readAsText(f)}
function quickAdd(){openModal('Quick add',[{name:'kind',label:'What do you want to add?',type:'select',options:['Client','Project','Expense / Travel','Invoice','Equipment','Team Member']}],d=>{closeModal();({Client:addClient,Project:addProject,'Expense / Travel':addExpense,Invoice:addInvoice,Equipment:addEquipment,'Team Member':addTeam})[d.kind]()})}
function render(p){cur=p;let v=$('#view');
if(p==='dashboard'){let invoiced=sum(db.invoices,x=>x.total),received=sum(db.payments,x=>x.amount),pending=sum(db.invoices,x=>Math.max(0,x.total-x.paid)),expenses=sum(db.expenses,x=>inBase(x.amount,x.currency,x.rate)),travel=sum(db.expenses.filter(x=>['Petrol','Diesel','Toll','Parking','Hotel','Food','Flight / Train Ticket','Local Transport'].includes(x.category)),x=>inBase(x.amount,x.currency,x.rate)),profit=received-expenses;v.innerHTML='<div class="muted">Business overview · '+esc(db.settings.business)+'</div><div class="grid stats">'+stat('Invoiced revenue',fmt(invoiced,db.settings.baseCurrency),'All issued invoices','blue')+stat('Payment received',fmt(received,db.settings.baseCurrency),'Recorded collections','green')+stat('Pending receivables',fmt(pending,db.settings.baseCurrency),'Outstanding invoice balance','amber')+stat('Business expenses',fmt(expenses,db.settings.baseCurrency),'All recorded expenses','red')+stat('Travel expenses',fmt(travel,db.settings.baseCurrency),'Fuel, toll, hotel, tickets','')+stat('Cash collected − expenses',fmt(profit,db.settings.baseCurrency),'Cash basis estimate',profit>=0?'green':'red')+stat('Clients',db.clients.length,'Registered clients','')+stat('Active projects',db.projects.filter(x=>['Booked','In Progress'].includes(x.status)).length,'Booked or in progress','')+'</div><div class="grid two">'+
'<div class="card"><div class="head"><h2>Recent invoices</h2>'+btn('View all',"nav('invoices')")+'</div>'+table(['Invoice','Client','Total','Paid','Status'],db.invoices.slice(0,5).map(x=>'<tr><td>'+esc(x.number)+'</td><td>'+esc(clientName(x.clientId))+'</td><td>'+fmt(x.total,x.currency)+'</td><td>'+fmt(x.paid,x.currency)+'</td><td><span class="pill '+(x.status==='Paid'?'':'pending')+'">'+x.status+'</span></td></tr>').join(''))+'</div>'+
'<div class="card"><div class="head"><h2>Recent travel & expenses</h2>'+btn('Add expense',"addExpense()")+'</div>'+table(['Date','Category','Client','Amount'],db.expenses.slice(0,5).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.category)+'</td><td>'+esc(clientName(x.clientId))+'</td><td>'+fmt(x.amount,x.currency)+'</td></tr>').join(''))+'</div></div>'+
'<div class="notice">Accounting note: invoice value, cash received and expenses are shown separately. For accurate profit reports, reconcile unpaid invoices, business costs and currency conversion rates.</div>'}
if(p==='clients'){v.innerHTML=head('Client directory',btn('+ Add client','addClient()',''))+'<div class="grid clientgrid">'+(db.clients.map(c=>{let inv=db.invoices.filter(x=>x.clientId===c.id),billed=sum(inv,x=>x.total),paid=sum(inv,x=>x.paid),exp=sum(db.expenses.filter(x=>x.clientId===c.id),x=>inBase(x.amount,x.currency,x.rate));return '<div class="card"><div style="font-size:17px;font-weight:800">'+esc(c.name)+'</div><div class="muted">'+esc(c.company||c.address||c.country||'Client')+' · '+esc(c.phone||'No phone')+'</div><div class="grid three" style="margin-top:15px;gap:8px"><div><div class="statlabel">Billed</div><b>'+fmt(billed,db.settings.baseCurrency)+'</b></div><div><div class="statlabel">Received</div><b class="green">'+fmt(paid,db.settings.baseCurrency)+'</b></div><div><div class="statlabel">Expenses</div><b class="red">'+fmt(exp,db.settings.baseCurrency)+'</b></div></div><div class="actions">'+btn('Financial profile',"clientDetail('"+c.id+"')")+' '+btn('Delete',"remove('clients','"+c.id+"')",'danger')+'</div></div>'}).join('')||'<div class="empty">Add your first client to begin.</div>')+'</div>'}
if(p==='projects'){v.innerHTML=head('Projects & shoot bookings',btn('+ New project','addProject()',''))+table(['Project','Client','Location','Shoot date','Service fee','Status',''],db.projects.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(clientName(x.clientId))+'</td><td>'+esc(x.location)+'</td><td>'+esc(x.date)+'</td><td>'+fmt(x.serviceFee,db.settings.baseCurrency)+'</td><td><span class="pill pending">'+esc(x.status)+'</span></td><td>'+btn('Add expense',"expenseForProject('"+x.id+"')")+' '+btn('Delete',"remove('projects','"+x.id+"')",'danger')+'</td></tr>').join(''))}
if(p==='expenses'){let total=sum(db.expenses,x=>inBase(x.amount,x.currency,x.rate)),bill=sum(db.expenses.filter(x=>x.billable==='yes'),x=>inBase(x.amount,x.currency,x.rate));v.innerHTML='<div class="grid stats">'+stat('Total expenses',fmt(total,db.settings.baseCurrency),'Converted to base currency','red')+stat('Client-billable',fmt(bill,db.settings.baseCurrency),'Can be added to invoice','green')+stat('Internal business cost',fmt(total-bill,db.settings.baseCurrency),'Not billed to client','')+stat('Expense records',db.expenses.length,'All travel and other costs','')+'</div>'+head('Expenses & travel register',btn('+ Add expense','addExpense()',''))+table(['Date','Client / Project','Route','Mode','Category','Amount','Billing',''],db.expenses.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(clientName(x.clientId))+'<br><small class="muted">'+esc(projectName(x.projectId))+'</small></td><td>'+esc(x.from||'—')+' → '+esc(x.to||'—')+'</td><td>'+esc(x.mode)+'</td><td>'+esc(x.category)+'</td><td>'+fmt(x.amount,x.currency)+'</td><td><span class="pill '+(x.billable==='yes'?'':'pending')+'">'+(x.billable==='yes'?'Client billable':'Business cost')+'</span>'+(x.invoiceId?'<br><small>Invoiced</small>':'')+'</td><td>'+btn('Delete',"remove('expenses','"+x.id+"')",'danger')+'</td></tr>').join(''))}
if(p==='invoices'){v.innerHTML=head('Invoices & payments',btn('+ Create invoice','addInvoice()',''))+table(['Invoice','Client','Project','Date','Total','Received','Balance','Status','Actions'],db.invoices.map(x=>'<tr><td><b>'+esc(x.number)+'</b></td><td>'+esc(clientName(x.clientId))+'</td><td>'+esc(projectName(x.projectId))+'</td><td>'+esc(x.date)+'</td><td>'+fmt(x.total,x.currency)+'</td><td class="green">'+fmt(x.paid,x.currency)+'</td><td class="amber">'+fmt(x.total-x.paid,x.currency)+'</td><td><span class="pill '+(x.status==='Paid'?'':'pending')+'">'+x.status+'</span></td><td>'+btn('PDF / Print',"printInvoice('"+x.id+"')")+' '+btn('Add payment',"addPayment('"+x.id+"')")+'</td></tr>').join(''))+head('Payment ledger')+table(['Date','Client','Invoice','Method','Amount','Reference'],db.payments.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(clientName(x.clientId))+'</td><td>'+esc(db.invoices.find(i=>i.id===x.invoiceId)?.number||'—')+'</td><td>'+esc(x.method)+'</td><td>'+fmt(x.amount,x.currency)+'</td><td>'+esc(x.reference)+'</td></tr>').join(''))}
if(p==='equipment'){v.innerHTML=head('Drone & equipment inventory',btn('+ Add equipment','addEquipment()',''))+table(['Equipment','Category','Serial','Purchase cost','Condition','Next maintenance',''],db.equipment.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.serial)+'</td><td>'+fmt(x.cost,db.settings.baseCurrency)+'</td><td>'+esc(x.condition)+'</td><td>'+esc(x.maintenance)+'</td><td>'+btn('Delete',"remove('equipment','"+x.id+"')",'danger')+'</td></tr>').join(''))}
if(p==='team'){v.innerHTML=head('Team directory',btn('+ Add member','addTeam()',''))+table(['Name','Role','Phone','Rate',''],db.team.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.role)+'</td><td>'+esc(x.phone)+'</td><td>'+fmt(x.rate,db.settings.baseCurrency)+'</td><td>'+btn('Delete',"remove('team','"+x.id+"')",'danger')+'</td></tr>').join(''))}
if(p==='reports'){let byClient=db.clients.map(c=>{let inv=db.invoices.filter(x=>x.clientId===c.id),received=sum(inv,x=>x.paid),billed=sum(inv,x=>x.total),exp=sum(db.expenses.filter(x=>x.clientId===c.id),x=>inBase(x.amount,x.currency,x.rate));return '<tr><td>'+esc(c.name)+'</td><td>'+fmt(billed,db.settings.baseCurrency)+'</td><td>'+fmt(received,db.settings.baseCurrency)+'</td><td>'+fmt(billed-received,db.settings.baseCurrency)+'</td><td>'+fmt(exp,db.settings.baseCurrency)+'</td><td>'+fmt(received-exp,db.settings.baseCurrency)+'</td></tr>'}).join('');v.innerHTML=head('Client-wise financial report')+table(['Client','Billed','Received','Receivable','Expenses','Cash margin*'],byClient)+ '<div class="notice">*Cash margin = received payments minus recorded client-linked expenses. This is a management view, not a tax or audited profit statement. Currency conversions use the rate saved on each record.</div>'+head('Expense category report')+table(['Category','Records','Total (base currency)'],[...new Set(db.expenses.map(x=>x.category))].map(cat=>'<tr><td>'+esc(cat)+'</td><td>'+db.expenses.filter(x=>x.category===cat).length+'</td><td>'+fmt(sum(db.expenses.filter(x=>x.category===cat),x=>inBase(x.amount,x.currency,x.rate)),db.settings.baseCurrency)+'</td></tr>').join(''))}
if(p==='settings'){v.innerHTML=head('Business settings')+'<div class="card"><form id="settingsForm" class="formgrid"><div><label>Business name</label><input name="business" value="'+esc(db.settings.business)+'"></div><div><label>Owner name</label><input name="owner" value="'+esc(db.settings.owner)+'"></div><div><label>Base currency</label><select name="baseCurrency">'+['INR','USD','AED','EUR','GBP','CAD','AUD','SGD','JPY'].map(c=>'<option '+(db.settings.baseCurrency===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div><label>Default fuel price per litre (base currency)</label><input name="fuelPrice" type="number" step=".01" value="'+esc(db.settings.fuelPrice)+'"></div><div><label>Default vehicle mileage (km/l)</label><input name="defaultMileage" type="number" step=".1" value="'+esc(db.settings.defaultMileage)+'"></div><div><label>Phone</label><input name="phone" value="'+esc(db.settings.phone)+'"></div><div><label>Email</label><input name="email" value="'+esc(db.settings.email)+'"></div><div class="wide"><label>Business address</label><textarea name="address">'+esc(db.settings.address)+'</textarea></div><div class="wide actions"><button>Save settings</button></div></form></div>'+head('Data backup & export')+'<div class="card actions"><button onclick="exportJSON()">Download full JSON backup</button><button class="secondary" onclick="document.querySelector(\'#restore\').click()">Restore backup</button><input id="restore" type="file" accept=".json,application/json" style="display:none" onchange="restoreFile(event)"><button class="secondary" onclick="exportCSV()">Export expenses CSV</button></div><div class="notice">This version stores data in this browser only. It does not yet provide cloud sync, login security, shared team access, automatic WhatsApp/email delivery or server-side scheduled reminders. Keep regular backups.</div>';$('#settingsForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.settings={...db.settings,...d};save();render('settings');alert('Settings saved')}}
}
function clientDetail(cid){let c=db.clients.find(x=>x.id===cid);if(!c)return;let inv=db.invoices.filter(x=>x.clientId===cid),exp=db.expenses.filter(x=>x.clientId===cid),billed=sum(inv,x=>x.total),paid=sum(inv,x=>x.paid),cost=sum(exp,x=>inBase(x.amount,x.currency,x.rate));$('#mt').textContent='Client financial profile';$('#mb').innerHTML='<div class="grid stats">'+stat('Total billed',fmt(billed,db.settings.baseCurrency),'Invoices issued','blue')+stat('Received',fmt(paid,db.settings.baseCurrency),'Payments recorded','green')+stat('Outstanding',fmt(billed-paid,db.settings.baseCurrency),'Balance due','amber')+stat('Linked expenses',fmt(cost,db.settings.baseCurrency),'Travel + other costs','red')+'</div><div class="card"><h3>'+esc(c.name)+'</h3><p class="muted">'+esc(c.phone)+' · '+esc(c.email)+' · '+esc(c.address)+'</p><h4>Invoices</h4>'+inv.map(x=>'<p>'+esc(x.number)+' — '+fmt(x.total,x.currency)+' · '+x.status+'</p>').join('')+'<h4>Expenses</h4>'+exp.map(x=>'<p>'+esc(x.date)+' · '+esc(x.category)+' · '+fmt(x.amount,x.currency)+' · '+(x.billable==='yes'?'Billable':'Internal')+'</p>').join('')+'</div><div class="actions"><button onclick="closeModal();addProjectForClient(\''+cid+'\')">New project</button><button class="secondary" onclick="closeModal();addExpenseForClient(\''+cid+'\')">Add expense</button><button class="secondary" onclick="closeModal();addInvoiceForClient(\''+cid+'\')">Create invoice</button></div>';$('#modal').classList.add('show')}
function addProjectForClient(cid){addProject();let s=$('#form select[name=clientId]');if(s)s.value=cid}function addExpenseForClient(cid){addExpense();let s=$('#form select[name=clientId]');if(s)s.value=cid}function addInvoiceForClient(cid){addInvoice();let s=$('#form select[name=clientId]');if(s)s.value=cid}
function expenseForProject(pid){addExpense();let p=db.projects.find(x=>x.id===pid);if(p){$('#form select[name=clientId]').value=p.clientId;$('#form select[name=projectId]').value=pid}}
function exportCSV(){let cols=['date','category','clientId','projectId','from','to','mode','amount','currency','billable'];let rows=db.expenses.map(x=>cols.map(k=>'"'+String(k==='clientId'?clientName(x[k]):k==='projectId'?projectName(x[k]):x[k]??'').replace(/"/g,'""')+'"').join(','));download('fpv-expenses.csv',[cols.join(','),...rows].join('\n'),'text/csv')}
render('dashboard');
</script></body></html>
